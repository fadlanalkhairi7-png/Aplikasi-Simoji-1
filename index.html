<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIMOJI — Bawaslu Provinsi Nusa Tenggara Barat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* merah bata ke jingga, mengikuti warna kelembagaan Bawaslu */
  --biru-tua:#8C1A10; --biru:#C0390F; --biru-muda:#E8853F;
  --merah:#8C1A10; --oranye:#E2620F; --oranye-muda:#F59B3C;
  --hijau-tua:#1A6340; --hijau:#227A50; --hijau-muda:#3BA170;
  --tinta:#3A1A11; --tinta-lembut:#7A574A;
  --garis:#E8C8B0; --garis-tipis:#F3DECE; --kertas:#FFFBF7;
  --amber:#96600A; --rust:#8C2B15;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Archivo','Segoe UI',system-ui,sans-serif;
  color:var(--tinta); font-size:15px; line-height:1.5; min-height:100vh;
  background:linear-gradient(160deg,#FDEADA 0%,#FBDFCC 52%,#F8D3C3 100%);
  background-attachment:fixed; -webkit-font-smoothing:antialiased;
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--biru);outline-offset:2px;}
.sj-muat{padding:80px 24px;text-align:center;color:var(--tinta-lembut);}
.sembunyi{display:none !important;}

.sj-lambang{display:flex;gap:4px;align-items:flex-end;height:32px;}
.sj-lambang span{display:block;width:6px;background:var(--biru-tua);}
.sj-lambang span:nth-child(1){height:32px;}
.sj-lambang span:nth-child(2){height:20px;background:var(--oranye-muda);}
.sj-lambang span:nth-child(3){height:26px;background:var(--oranye);}
.sj-lambang-kecil{height:22px;gap:3px;}
.sj-lambang-kecil span{width:4px;background:#fff;}
.sj-lambang-kecil span:nth-child(1){height:22px;}
.sj-lambang-kecil span:nth-child(2){height:13px;background:#FFC48A;}
.sj-lambang-kecil span:nth-child(3){height:18px;background:#FFDFC6;}

.sj-masuk{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh;}
.sj-masuk-kiri{background:linear-gradient(155deg,#6E120A 0%,#B8320E 48%,#E2620F 100%);color:#FFF4EC;padding:52px 46px;display:flex;flex-direction:column;gap:10px;justify-content:center;}
.sj-brand{font-size:50px;font-weight:700;letter-spacing:-0.03em;margin:10px 0 0;}
.sj-brand-sub{font-family:'Archivo Narrow',sans-serif;font-size:17px;color:#F7CFAE;margin:0;}
.sj-lembaga{font-family:'Archivo Narrow',sans-serif;font-size:15px;font-weight:600;color:#FFD9BC;margin:6px 0 0;line-height:1.35;letter-spacing:.01em;}
.sj-masuk-teks{max-width:40ch;color:#FCE3D3;margin:16px 0 0;}
.sj-masuk-daftar{max-width:42ch;margin:22px 0 0;padding:16px 0 0 18px;border-top:1px solid rgba(255,255,255,.22);color:#F2C8AA;font-size:13px;line-height:1.7;}
.sj-masuk-kanan{padding:52px 46px;display:flex;flex-direction:column;gap:16px;justify-content:center;max-width:560px;background:rgba(255,255,255,.62);}
.sj-tabs{display:flex;border-bottom:1px solid var(--garis);}
.sj-tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 2px;margin-right:26px;font:inherit;color:var(--tinta-lembut);cursor:pointer;}
.sj-tab.aktif{color:var(--merah);border-bottom-color:var(--oranye);font-weight:600;}
.sj-segmen{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--garis);border-radius:2px;overflow:hidden;background:#fff;}
.sj-segmen button{padding:11px 10px;background:none;border:none;font:inherit;font-size:14px;color:var(--tinta-lembut);cursor:pointer;}
.sj-segmen button + button{border-left:1px solid var(--garis);}
.sj-segmen button.aktif{background:var(--biru-tua);color:#EAF5F1;font-weight:600;}

.sj-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:linear-gradient(95deg,#8C1A10 0%,#C0390F 60%,#E2620F 100%);border-bottom:3px solid var(--oranye-muda);color:#FFF4EC;flex-wrap:wrap;}
.sj-bar-kiri{display:flex;align-items:center;gap:12px;}
.sj-bar-nama{font-weight:700;font-size:20px;letter-spacing:-0.02em;line-height:1.1;}
.sj-bar-sub{font-family:'Archivo Narrow',sans-serif;font-size:13px;color:#F7CFAE;}
.sj-bar-kanan{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.sj-pengguna{font-size:14px;}
.sj-bar-nip{font-family:'Archivo Narrow',sans-serif;color:#F7CFAE;}
.sj-bar .sj-btn-teks{color:#FBDCC5;}
.sj-bar .sj-btn-teks:hover{color:#fff;}
.sj-nav{display:flex;background:rgba(255,255,255,.72);border-bottom:1px solid var(--garis);padding:0 28px;overflow-x:auto;}
.sj-navbtn{background:none;border:none;border-bottom:3px solid transparent;padding:12px 4px;margin-right:26px;font:inherit;color:var(--tinta-lembut);cursor:pointer;white-space:nowrap;}
.sj-navbtn.aktif{color:var(--merah);border-bottom-color:var(--oranye);font-weight:600;}
.sj-kabar{padding:10px 28px;background:var(--merah);color:#FFF4EC;font-size:14px;}
.sj-isi{padding:26px 28px;max-width:1120px;margin:0 auto;}
.sj-kaki{padding:20px 28px 40px;max-width:1120px;margin:0 auto;color:var(--tinta-lembut);font-size:13px;border-top:1px solid var(--garis);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;}

.sj-ruler{padding:24px 0 18px;border-bottom:1px solid var(--garis);}
.sj-ruler-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
.sj-ruler-num{font-size:60px;font-weight:700;letter-spacing:-0.04em;line-height:1;color:var(--biru-tua);}
.sj-ruler-unit{font-size:19px;font-weight:500;letter-spacing:0;color:var(--tinta-lembut);margin-left:8px;}
.sj-ruler-sub{color:var(--tinta-lembut);margin-top:4px;}
.sj-ruler-tgl{text-align:right;}
.sj-ruler-tgl-v{font-family:'Archivo Narrow',sans-serif;font-size:20px;font-weight:600;color:var(--hijau-tua);}
.sj-ruler-track{position:relative;height:30px;border-bottom:2px solid var(--biru-tua);}
.sj-ruler-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(55,165,124,.24);transition:width .5s ease;}
.sj-ruler-ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end;}
.sj-tick{width:1px;height:8px;background:var(--garis);}
.sj-tick-mayor{height:16px;background:var(--tinta-lembut);}
.sj-ruler-mark{position:absolute;bottom:-6px;width:2px;height:36px;background:var(--biru);transition:left .5s ease;}
.sj-ruler-mark::after{content:"";position:absolute;top:-7px;left:-4px;width:10px;height:10px;background:var(--biru);border-radius:50%;}
.sj-ruler-foot{display:flex;justify-content:space-between;margin-top:8px;font-family:'Archivo Narrow',sans-serif;font-size:12px;color:var(--tinta-lembut);}

.sj-statbar{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--garis);background:rgba(255,255,255,.62);}
.sj-statbar-2{grid-template-columns:repeat(2,1fr);}
.sj-stat{padding:18px 20px;border-right:1px solid var(--garis);}
.sj-stat:last-child{border-right:none;}
.sj-stat-n{font-size:36px;font-weight:700;letter-spacing:-0.03em;line-height:1;color:var(--biru-tua);}
.sj-stat-l{font-family:'Archivo Narrow',sans-serif;color:var(--tinta-lembut);margin-top:6px;font-size:14px;}
.sj-amber{color:var(--amber);} .sj-hijau{color:var(--hijau);} .sj-biru{color:var(--biru);}

.sj-toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 0;flex-wrap:wrap;}
.sj-chips{display:flex;gap:8px;flex-wrap:wrap;}
.sj-chip{background:rgba(255,255,255,.7);border:1px solid var(--garis);border-radius:2px;padding:6px 12px;font:inherit;font-size:13px;color:var(--tinta-lembut);cursor:pointer;}
.sj-chip.aktif{background:var(--biru-tua);color:#EAF6F1;border-color:var(--biru-tua);}
.sj-cari{border:1px solid var(--garis);border-radius:2px;padding:8px 12px;font:inherit;font-size:14px;background:#fff;min-width:240px;color:var(--tinta);}
.sj-aksi-kanan{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.sj-tabel{border:1px solid var(--garis);background:rgba(255,255,255,.66);}
.sj-thead{display:grid;gap:16px;padding:9px 14px;background:rgba(140,26,16,.07);border-bottom:1px solid var(--garis);font-family:'Archivo Narrow',sans-serif;font-size:13px;color:var(--tinta-lembut);}
.sj-trow{display:grid;gap:16px;align-items:center;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--garis-tipis);padding:12px 14px;font:inherit;color:inherit;cursor:pointer;}
.sj-trow:last-child{border-bottom:none;}
.sj-trow:hover{background:#fff;}
.sj-statis{cursor:default;} .sj-statis:hover{background:none;}
.sj-row3{grid-template-columns:1.4fr 1fr auto;}
.sj-row4{grid-template-columns:1.4fr .7fr 1fr auto;}
.sj-row5{grid-template-columns:1.5fr .9fr 1fr 1fr auto;}
.sj-td{display:flex;flex-direction:column;min-width:0;}
.sj-td strong{font-weight:600;}
.sj-td-num{font-variant-numeric:tabular-nums;}
.sj-td-status{align-items:flex-end;}
.sj-td-aksi{flex-direction:row;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.sj-row-meta{font-family:'Archivo Narrow',sans-serif;font-size:13px;color:var(--tinta-lembut);display:block;}

.sj-badge{display:inline-block;font-family:'Archivo Narrow',sans-serif;font-size:13px;padding:3px 9px;border:1px solid;border-radius:2px;white-space:nowrap;}
.sj-badge-biru{color:var(--biru);border-color:var(--biru-muda);background:rgba(74,143,184,.12);}
.sj-badge-hijau{color:var(--hijau-tua);border-color:var(--hijau);background:rgba(18,122,92,.12);}
.sj-badge-amber{color:var(--amber);border-color:var(--amber);background:rgba(149,97,11,.1);}
.sj-badge-rust{color:var(--rust);border-color:var(--rust);background:rgba(140,53,32,.1);}
.sj-badge-netral{color:var(--tinta-lembut);border-color:var(--garis);background:#fff;}

.sj-panel{background:rgba(255,255,255,.76);border:1px solid var(--garis);border-radius:2px;padding:24px;}
.sj-panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.sj-panel-head h2{font-size:23px;font-weight:600;letter-spacing:-0.02em;margin:0;color:var(--biru-tua);}
.sj-mt{margin-top:26px;}
.sj-sub{font-family:'Archivo Narrow',sans-serif;font-size:15px;color:var(--merah);border-bottom:1px solid var(--garis);padding-bottom:6px;margin:22px 0 14px;}
.sj-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;}
.sj-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.sj-field > span{font-family:'Archivo Narrow',sans-serif;font-size:14px;color:var(--tinta-lembut);}
.sj-field input,.sj-field select,.sj-field textarea{border:1px solid var(--garis);border-radius:2px;padding:9px 11px;font:inherit;font-size:15px;background:#fff;color:var(--tinta);width:100%;}
.sj-field textarea{resize:vertical;}
.sj-gabung{display:flex;gap:8px;}
.sj-gabung .sj-btn{white-space:nowrap;padding:8px 14px;}
.sj-bantuan{font-size:13px;color:var(--tinta-lembut);margin:4px 0 0;}
.sj-bantuan code,.sj-info code{background:var(--kertas);padding:1px 5px;border:1px solid var(--garis);font-family:'Archivo Narrow',sans-serif;}
.sj-galat{border-left:3px solid var(--rust);background:rgba(140,53,32,.08);color:var(--rust);padding:9px 12px;font-size:14px;margin:12px 0;}
.sj-info{border-left:3px solid var(--hijau);background:rgba(18,122,92,.09);color:var(--hijau-tua);padding:9px 12px;font-size:14px;margin:12px 0;}
.sj-kekuatan{display:flex;align-items:center;gap:10px;margin-top:6px;}
.sj-kekuatan-bar{display:flex;gap:4px;}
.sj-kekuatan-bar span{width:34px;height:4px;background:var(--garis);border-radius:2px;}
.sj-kekuatan-bar span.terisi{background:var(--amber);}
.sj-kekuatan-bar span.terisi.t3{background:var(--hijau);}
.sj-kekuatan-bar span.terisi.t4{background:var(--hijau-tua);}

.sj-drop{width:100%;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:20px;background:var(--kertas);border:1px dashed var(--oranye);border-radius:2px;font:inherit;color:var(--tinta);cursor:pointer;}
.sj-drop span{font-size:13px;color:var(--tinta-lembut);}
.sj-pratinjau{display:flex;gap:16px;align-items:flex-start;}
.sj-pratinjau img{width:150px;height:110px;object-fit:cover;border:1px solid var(--garis);}
.sj-pratinjau-nama{font-family:'Archivo Narrow',sans-serif;font-weight:600;}
.sj-slots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.sj-slot{border:1px solid var(--garis-tipis);padding:10px;background:#fff;}
.sj-slot .sj-drop{padding:14px;}
.sj-slot .sj-pratinjau img{width:110px;height:82px;}
.sj-lampiran-satu{margin-bottom:14px;}
.sj-lampiran-satu .sj-kv-l{margin-bottom:4px;}
.sj-rust{color:var(--rust);}
@media (max-width:900px){ .sj-slots{grid-template-columns:1fr;} }

.sj-btn{font:inherit;border-radius:2px;cursor:pointer;padding:10px 18px;border:1px solid transparent;}
.sj-btn:disabled{opacity:.5;cursor:not-allowed;}
.sj-btn-utama{background:var(--biru-tua);color:#EAF5F1;}
.sj-btn-utama:hover:not(:disabled){background:#082944;}
.sj-btn-halus{background:#fff;color:var(--biru-tua);border-color:var(--biru-tua);}
.sj-btn-setuju{background:var(--hijau);color:#fff;}
.sj-btn-setuju:hover{background:var(--hijau-tua);}
.sj-btn-tolak{background:none;color:var(--rust);border-color:var(--rust);}
.sj-btn-teks{background:none;color:var(--biru);border:none;padding:6px 2px;text-decoration:underline;text-underline-offset:3px;}
.sj-btn-teks:hover{color:var(--biru-tua);}
.sj-aksi{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.sj-hapus{color:var(--rust);}
.sj-kosong{padding:40px 0 32px;border-bottom:1px solid var(--garis);max-width:52ch;}
.sj-kosong h2{font-size:27px;font-weight:600;letter-spacing:-0.02em;margin:0 0 8px;color:var(--biru-tua);}
.sj-kosong p{color:var(--tinta-lembut);margin:0 0 18px;}

.sj-tirai{position:fixed;inset:0;background:rgba(92,20,12,.52);display:flex;justify-content:flex-end;z-index:40;}
.sj-laci{width:min(560px,100%);background:var(--kertas);height:100%;overflow-y:auto;padding:24px 26px 40px;border-left:4px solid var(--oranye);animation:sj-geser .2s ease-out;}
.sj-laci-kecil{width:min(440px,100%);}
@keyframes sj-geser{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sj-laci{animation:none}.sj-ruler-fill,.sj-ruler-mark{transition:none}}
.sj-laci-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--garis);}
.sj-laci-head h2{font-size:22px;font-weight:600;letter-spacing:-0.02em;margin:0;color:var(--biru-tua);}
.sj-laci-head p{margin:4px 0 0;}
.sj-laci-status{padding:14px 0;}
.sj-lampiran{margin-bottom:18px;}
.sj-lampiran-img{display:block;width:100%;padding:0;border:1px solid var(--garis);background:#fff;cursor:zoom-in;}
.sj-lampiran-img img{display:block;width:100%;max-height:330px;object-fit:contain;background:#fff;}
.sj-lampiran-kosong{padding:32px;text-align:center;color:var(--tinta-lembut);border:1px dashed var(--garis);font-size:14px;}
.sj-kv{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--garis-tipis);align-items:baseline;}
.sj-kv-l{font-family:'Archivo Narrow',sans-serif;font-size:14px;color:var(--tinta-lembut);}
.sj-kv-v{font-size:15px;}
.sj-verifikasi{margin-top:22px;padding-top:18px;border-top:2px solid var(--oranye);}
.sj-zoom{position:fixed;inset:0;background:rgba(92,20,12,.93);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;cursor:zoom-out;}
.sj-zoom img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;}

@media (max-width:900px){
  .sj-masuk{grid-template-columns:1fr;}
  .sj-masuk-kiri{padding:32px 20px;}
  .sj-masuk-kanan{padding:26px 20px 44px;max-width:none;}
  .sj-brand{font-size:38px;}
  .sj-isi{padding:20px 14px;}
  .sj-bar,.sj-nav,.sj-kabar,.sj-kaki{padding-left:14px;padding-right:14px;}
  .sj-statbar,.sj-statbar-2{grid-template-columns:1fr 1fr;}
  .sj-stat{padding:14px 16px;}
  .sj-stat:nth-child(2){border-right:none;}
  .sj-stat:nth-child(3),.sj-stat:nth-child(4){border-top:1px solid var(--garis);}
  .sj-grid2{grid-template-columns:1fr;}
  .sj-segmen{grid-template-columns:1fr;}
  .sj-segmen button + button{border-left:none;border-top:1px solid var(--garis);}
  .sj-panel{padding:16px;}
  .sj-ruler-num{font-size:44px;}
  .sj-thead{display:none;}
  .sj-row3,.sj-row4,.sj-row5{grid-template-columns:1fr auto;gap:8px;}
  .sj-row5 .sj-td:nth-child(2),.sj-row4 .sj-td:nth-child(3),.sj-row3 .sj-td:nth-child(2){display:none;}
  .sj-td-aksi{grid-column:1 / -1;justify-content:flex-start;}
  .sj-cari{min-width:0;flex:1;}
  .sj-kv{grid-template-columns:1fr;gap:2px;}
  .sj-laci{padding:18px 14px 36px;}
  .sj-ruler-foot span:nth-child(2),.sj-ruler-foot span:nth-child(4){display:none;}
}
</style>
</head>
<body>
<div id="app"><div class="sj-muat">Menyiapkan Simoji…</div></div>
<div id="lapis"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* ============================================================
   Sambungan Supabase
   ============================================================ */
var SB_URL = "https://jmubbpsnjxkrazebqmrj.supabase.co";
var SB_KEY = "sb_publishable_SKcn4cQrOBdG8eo6fZfAOA_QxaA5jzW";
var DOMAIN = "simoji.local";   // NIP dipetakan jadi <nip>@simoji.local
var BUCKET = "berkas-kgb";

var sb = window.supabase.createClient(SB_URL, SB_KEY);

/* klien kedua: dipakai admin untuk mendaftarkan orang lain
   tanpa mengganggu sesinya sendiri */
var sbDua = window.supabase.createClient(SB_URL, SB_KEY, {
  auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:"sb-simoji-kedua" }
});

var suratDariNip = function(nip){ return nip + "@" + DOMAIN; };

/* ============================================================
   Utilitas
   ============================================================ */
function angkaSaja(s){ return String(s==null?"":s).replace(/[^\d]/g,""); }
function bersihkan(s, maks){ return String(s==null?"":s).replace(/[<>]/g,"").trim().slice(0, maks||120); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var BULAN_S = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

function tambahTahun(iso, n){
  if(!iso) return "";
  var d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return "";
  d.setFullYear(d.getFullYear() + n);
  return d.toISOString().slice(0,10);
}
function tglIndo(iso){
  if(!iso) return "—";
  var d = new Date(iso + "T00:00:00");
  return isNaN(d) ? "—" : d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear();
}
function tglSingkat(iso){
  if(!iso) return "—";
  var d = new Date(iso + "T00:00:00");
  return isNaN(d) ? "—" : d.getDate() + " " + BULAN_S[d.getMonth()] + " " + d.getFullYear();
}
function jamTanggal(ts){
  if(!ts) return "—";
  var d = new Date(ts), p = function(n){ return String(n).padStart(2,"0"); };
  return p(d.getDate()) + "/" + p(d.getMonth()+1) + "/" + d.getFullYear() + " " + p(d.getHours()) + "." + p(d.getMinutes());
}
function selisihHari(iso){
  if(!iso) return null;
  var d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return null;
  var kini = new Date(); kini.setHours(0,0,0,0);
  return Math.round((d - kini) / 86400000);
}
function rupiah(n){
  var v = Number(n);
  if(!v && v !== 0) return "—";
  return "Rp " + v.toLocaleString("id-ID");
}
function waktuRelatif(ts){
  if(!ts) return "—";
  var d = Math.floor((Date.now() - ts) / 1000);
  if(d < 60) return "baru saja";
  if(d < 3600) return Math.floor(d/60) + " menit lalu";
  if(d < 86400) return Math.floor(d/3600) + " jam lalu";
  return Math.floor(d/86400) + " hari lalu";
}
function nilaiSandi(s){
  var n = 0;
  if(s.length >= 8) n++;
  if(s.length >= 12) n++;
  if(/[a-z]/.test(s) && /[A-Z]/.test(s)) n++;
  if(/\d/.test(s)) n++;
  if(/[^A-Za-z0-9]/.test(s)) n++;
  return Math.min(n,4);
}
function periksaSandi(s){
  if(s.length < 8) return "Kata sandi minimal 8 karakter.";
  if(!/[A-Za-z]/.test(s) || !/\d/.test(s)) return "Kata sandi harus memuat huruf dan angka.";
  if(/^(123|password|admin|qwerty)/i.test(s)) return "Kata sandi terlalu mudah ditebak.";
  return "";
}
function sandiAcak(){
  var abjad = "abcdefghjkmnpqrstuvwxyz", angka = "23456789", s = "";
  for(var i=0;i<6;i++) s += abjad[Math.floor(Math.random()*abjad.length)];
  for(var j=0;j<3;j++) s += angka[Math.floor(Math.random()*angka.length)];
  return s + "A";
}
function pesanGalat(e){
  var t = (e && (e.message || e.error_description || e)) + "";
  if(/Invalid login credentials/i.test(t)) return "NIP atau kata sandi salah.";
  if(/already registered|already exists|duplicate key/i.test(t)) return "NIP ini sudah punya akun.";
  if(/Email address .* is invalid|invalid format/i.test(t)) return "Format NIP ditolak server. Ubah nilai DOMAIN di kode.";
  if(/Email not confirmed/i.test(t)) return "Konfirmasi surel masih menyala di Supabase. Matikan di Authentication → Providers → Email.";
  if(/rate limit|too many/i.test(t)) return "Terlalu sering mencoba. Tunggu sebentar lalu ulangi.";
  if(/Failed to fetch|NetworkError/i.test(t)) return "Tidak bisa menghubungi server. Periksa koneksi.";
  if(/row-level security|violates/i.test(t)) return "Ditolak aturan keamanan basis data.";
  return t;
}

/* ---------- gambar ---------- */
function kompresGambar(file, maxDim, mutu){
  maxDim = maxDim || 1200; mutu = mutu || 0.7;
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var skala = Math.min(1, maxDim / Math.max(w,h));
        w = Math.round(w*skala); h = Math.round(h*skala);
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        c.toBlob(function(blob){ resolve({ blob: blob, url: c.toDataURL("image/jpeg", mutu) }); }, "image/jpeg", mutu);
      };
      img.onerror = function(){ reject(new Error("Berkas itu bukan gambar yang bisa dibaca.")); };
      img.src = fr.result;
    };
    fr.onerror = function(){ reject(new Error("Berkas gagal dibuka. Coba pilih ulang.")); };
    fr.readAsDataURL(file);
  });
}

/* Cari gaji pokok dari tabel yang dimuat dari Supabase.
   Mengembalikan null bila golongan itu belum ada isinya. */
function cariGaji(golongan, mkgTahun){
  var cocok = null;
  for(var i=0;i<S.gaji.length;i++){
    var b = S.gaji[i];
    if(b.golongan === golongan && b.mkg_min <= mkgTahun){
      if(!cocok || b.mkg_min > cocok.mkg_min) cocok = b;
    }
  }
  return cocok ? cocok.gaji : null;
}

/* Masa kerja golongan pada tanggal tertentu, dihitung dari
   masa kerja saat SK terakhir ditetapkan. */
function mkgPada(mkgTahun, mkgBulan, tmtLama, tmtTarget){
  if(!tmtLama || !tmtTarget) return Number(mkgTahun)||0;
  var a = new Date(tmtLama + "T00:00:00"), b = new Date(tmtTarget + "T00:00:00");
  if(isNaN(a) || isNaN(b)) return Number(mkgTahun)||0;
  var bulan = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  var total = (Number(mkgTahun)||0)*12 + (Number(mkgBulan)||0) + bulan;
  return Math.floor(total/12);
}

function kirimMasuk(){
  var tombol = q("#m-kirim");
  tampilGalat("");
  var nip = angkaSaja(nilai("m-nip")), sandi = nilai("m-sandi");
  if(!nip || !sandi) return tampilGalat("Isi NIP dan kata sandi.");

  tombol.disabled = true; tombol.textContent = "Memproses…";
  sb.auth.signInWithPassword({ email: suratDariNip(nip), password: sandi })
    .then(function(r){
      if(r.error) throw r.error;
      return muatProfil();
    })
    .then(function(profil){
      if(!profil) throw new Error("Akun Anda belum punya profil. Hubungi admin.");
      if(profil.peran !== S.peranPilih){
        var p = profil.peran;
        return sb.auth.signOut().then(function(){
          throw new Error('Akun ini terdaftar sebagai ' + p + '. Pilih "Masuk sebagai ' + p + '".');
        });
      }
      S.sesi = profil;
      S.tab = "beranda";
      return catat("Masuk", "sebagai " + profil.peran).then(mulaiPanel);
    })
    .catch(function(e){
      tampilGalat(pesanGalat(e));
      if(q("#m-kirim")){ tombol.disabled = false; tombol.textContent = "Masuk sebagai " + S.peranPilih; }
    });
}

function kirimDaftar(){
  var tombol = q("#m-kirim");
  tampilGalat("");
  var nama = bersihkan(nilai("m-nama")), nip = angkaSaja(nilai("m-nip"));
  var sandi = nilai("m-sandi"), ulangi = nilai("m-ulangi");
  if(nama.length < 3) return tampilGalat("Tulis nama lengkap Anda.");
  if(nip.length < 8) return tampilGalat("NIP minimal 8 angka.");
  var pesan = periksaSandi(sandi);
  if(pesan) return tampilGalat(pesan);
  if(sandi !== ulangi) return tampilGalat("Ulangan kata sandi belum sama.");

  tombol.disabled = true; tombol.textContent = "Memproses…";
  sb.auth.signUp({
    email: suratDariNip(nip), password: sandi,
    options: { data: { nip: nip, nama: nama, peran: S.peranPilih } }
  }).then(function(r){
    if(r.error) throw r.error;
    if(!r.data.session) throw new Error("Akun dibuat tapi belum bisa masuk. Matikan Confirm email di Supabase, lalu coba masuk.");
    return muatProfil();
  }).then(function(profil){
    if(!profil) throw new Error("Profil gagal dibuat. Pastikan skema SQL sudah dijalankan.");
    S.sesi = profil;
    S.tab = "beranda";
    return catat("Buat akun", "peran " + profil.peran).then(mulaiPanel);
  }).catch(function(e){
    tampilGalat(pesanGalat(e));
    if(q("#m-kirim")){ tombol.disabled = false; tombol.textContent = "Buat akun"; }
  });
}

function muatProfil(){
  return sb.auth.getUser().then(function(r){
    if(!r.data || !r.data.user) return null;
    return sb.from("profil").select("*").eq("id", r.data.user.id).maybeSingle();
  }).then(function(res){
    if(!res || res.error || !res.data) return null;
    return dariProfil(res.data);
  });
}

function muatPendukung(){
  return Promise.all([
    sb.from("gaji_pokok").select("*"),
    sb.from("instansi").select("*").eq("id",1).maybeSingle()
  ]).then(function(h){
    S.gaji = h[0].data || [];
    S.instansi = (h[1] && h[1].data) || {};
  }).catch(function(){});
}

function muatData(){
  var kerja = [ sb.from("pengajuan").select("*").order("dibuat", { ascending:false }) ];
  if(S.sesi.peran === "admin"){
    kerja.push(sb.from("profil").select("*").order("dibuat", { ascending:false }));
    kerja.push(sb.from("log_aktivitas").select("*").order("ts", { ascending:false }).limit(300));
  }
  return Promise.all(kerja).then(function(hasil){
    S.daftar = (hasil[0].data || []).map(dariBaris);
    if(S.sesi.peran === "admin"){
      S.akun = (hasil[1].data || []).map(dariProfil);
      S.log = (hasil[2].data || []).map(function(l){
        return { ts:new Date(l.ts).getTime(), aktor:l.aktor, aksi:l.aksi, rincian:l.rincian };
      });
    }
  });
}

function mulaiPanel(){
  return muatPendukung().then(muatData).then(function(){
    gambar();
    if(S.sesi.wajibGanti) bukaUbahSandi(true);
  });
}

  pasang(".sj-navbtn", "click", function(){ S.tab = this.dataset.tab; gambarIsi(); });
  gambarIsi();
}

function gambarIsi(){
  qq(".sj-navbtn").forEach(function(b){ b.classList.toggle("aktif", b.dataset.tab === S.tab); });
  if(S.sesi.peran === "admin"){
    if(S.tab === "akun")    return isiAkun();
    if(S.tab === "log")     return isiLog();
    if(S.tab === "pegawai") return isiDataPegawai();
    if(S.tab === "usulan")  return isiBerkas();
    if(S.tab === "gaji")    return isiGaji();
    return isiPengingat();
  }
  if(S.tab === "ajukan") return isiForm();
  if(S.tab === "profil") return isiProfil();
  return isiBeranda();
}

function isiBeranda(){

  var terakhir = milik[0];
  var html = terakhir ? penggaris(terakhir.tmtLama, terakhir.tmtBaru)
    : '<div class="sj-kosong"><h2>Belum ada pengajuan atas nama Anda</h2>' +
      '<p>Catat SK berkala terakhir Anda sekali, lalu Simoji menghitung sendiri kapan berkala berikutnya jatuh tempo.</p>' +
      '<button class="sj-btn sj-btn-utama" id="b-ajukan1">Ajukan sekarang</button></div>';

  html += '<div class="sj-panel-head sj-mt"><h2>Riwayat pengajuan</h2><div class="sj-aksi-kanan">' +
    '<button class="sj-btn sj-btn-teks" id="b-segar">Muat ulang</button>' +
    '<button class="sj-btn sj-btn-utama" id="b-ajukan2">Pengajuan baru</button></div></div>';

  } else {
    html += '<div class="sj-tabel"><div class="sj-thead sj-row3"><span>Berlaku mulai</span><span>Gaji usulan</span><span>Status</span></div>' +
      milik.map(function(d){

          '<span class="sj-td"><strong>' + tglSingkat(d.tmtBaru) + '</strong><span class="sj-row-meta">' +
            esc(d.pangkat) + ' · ' + esc(d.golongan) + ' · ' + esc(d.unit) + '</span></span>' +
          '<span class="sj-td sj-td-num">' + rupiah(d.gajiBaru || d.gajiLama) +

          '<span class="sj-td sj-td-status">' + lencana(d.status) + '</span></button>';
      }).join("") + '</div>';

  q("#isi").innerHTML = html;

  pasang(".sj-trow", "click", function(){ bukaDetail(this.dataset.id, "pegawai"); }, q("#isi"));
}

  q("#p-simpan").addEventListener("click", function(){

    var isi = {

      masa_kerja_bulan: Number(angkaSaja(nilai("p-mkb"))) || 0
    };

    sb.from("profil").update(isi).eq("id", S.sesi.id).then(function(r){
      if(r.error) throw r.error;
      return muatProfil();

/* ============================================================
   Pegawai — formulir
   ============================================================ */
function isiForm(){
  var p = S.sesi.profil;
  S.berkas = {};
  var thn = new Date().getFullYear();
  var SLOT = [
    { k:"sk",      judul:"SK gaji berkala terakhir",  wajib:true },
    { k:"pangkat", judul:"SK kenaikan pangkat terakhir", wajib:true },
    { k:"skp1",    judul:"SKP tahun " + (thn-1),      wajib:true },
    { k:"skp2",    judul:"SKP tahun " + (thn-2),      wajib:true }
  ];
  function kotakUnggah(s){
    return '<div class="sj-slot" id="slot-' + s.k + '">' +
      '<input type="file" id="file-' + s.k + '" accept="image/*" hidden>' +
      '<button class="sj-drop" data-pilih="' + s.k + '"><strong>' + esc(s.judul) + '</strong>' +
      '<span>Ketuk untuk memilih pindaian, format JPG atau PNG.</span></button></div>';
  }
  q("#isi").innerHTML =
  '<div class="sj-panel"><div class="sj-panel-head"><h2>Ajukan kenaikan gaji berkala</h2>' +
    '<button class="sj-btn sj-btn-teks" id="f-batal">Kembali</button></div>' +
    (p.pangkat && p.unit
      ? '<p class="sj-info">Data kepegawaian terisi dari profil Anda. Ubah di sini bila ada yang berbeda.</p>'
      : '<p class="sj-bantuan">Isi menu Profil sekali saja supaya bagian ini terisi sendiri pada pengajuan berikutnya.</p>') +
    '<div class="sj-grid2 sj-mt">' +
      '<label class="sj-field"><span>Pangkat</span><input id="f-pangkat" value="' + esc(p.pangkat) + '" placeholder="Penata Muda Tingkat I"></label>' +
      '<label class="sj-field"><span>Golongan ruang</span><select id="f-golongan">' + pilihanGolongan(p.golongan) + '</select></label>' +
      '<label class="sj-field"><span>Jabatan</span><input id="f-jabatan" value="' + esc(p.jabatan) + '" placeholder="Guru Ahli Pertama"></label>' +
      '<label class="sj-field"><span>Unit kerja</span><input id="f-unit" value="' + esc(p.unit) + '" placeholder="SMPN 3 Medan"></label>' +
    '</div>' +
    '<div class="sj-sub">Masa kerja golongan</div><div class="sj-grid2">' +
      '<label class="sj-field"><span>Tahun</span><input id="f-mkt" inputmode="numeric" value="' + esc(p.masaKerjaTahun) + '"></label>' +
      '<label class="sj-field"><span>Bulan</span><input id="f-mkb" inputmode="numeric" value="' + esc(p.masaKerjaBulan) + '"></label>' +
    '</div>' +
    '<div class="sj-sub">Data gaji berkala</div><div class="sj-grid2">' +
      '<label class="sj-field"><span>Nomor SK berkala terakhir</span><input id="f-nosk" placeholder="821.2/145/BKD/2024"></label>' +
      '<label class="sj-field"><span>TMT berkala terakhir</span><input id="f-tmtlama" type="date"></label>' +
      '<label class="sj-field"><span>TMT berkala berikutnya</span><input id="f-tmtbaru" type="date"></label>' +
      '<label class="sj-field"><span>Gaji pokok saat ini</span><input id="f-gajilama" inputmode="numeric" placeholder="3.203.600"></label>' +
      '<label class="sj-field"><span>Gaji pokok usulan</span><input id="f-gajibaru" inputmode="numeric" placeholder="3.305.100"></label>' +
    '</div>' +
    '<p class="sj-bantuan" id="f-hitung"></p>' +
    '<div id="f-otomatis"></div>' +
    '<div class="sj-sub">Lampiran wajib</div>' +
    '<p class="sj-bantuan">Empat berkas berikut harus dilampirkan seluruhnya. Foto dari kamera HP boleh, asalkan tulisannya terbaca.</p>' +
    '<div class="sj-slots">' + SLOT.map(kotakUnggah).join("") + '</div>' +
    '<label class="sj-field"><span>Catatan untuk kepegawaian</span>' +
      '<textarea id="f-catatan" rows="3" placeholder="Contoh: SK asli sudah diserahkan ke bagian umum pada 2 September."></textarea></label>' +
    '<div id="galat" class="sembunyi"></div>' +
    '<div class="sj-aksi"><button class="sj-btn sj-btn-utama" id="f-kirim">Kirim pengajuan</button>' +
      '<button class="sj-btn sj-btn-halus" id="f-batal2">Batal</button></div></div>';

  function keBeranda(){ S.tab = "beranda"; gambarIsi(); }
  q("#f-batal").addEventListener("click", keBeranda);
  q("#f-batal2").addEventListener("click", keBeranda);

  q("#f-tmtlama").addEventListener("change", function(){
    if(!nilai("f-tmtbaru")) q("#f-tmtbaru").value = tambahTahun(this.value, 2);
    hitung(); isiOtomatis();
  });
  q("#f-tmtbaru").addEventListener("change", hitung);
  ["f-gajilama","f-gajibaru"].forEach(function(id){
    q("#"+id).addEventListener("input", function(){
      var a = angkaSaja(this.value);
      this.value = a ? Number(a).toLocaleString("id-ID") : "";
      hitung();
    });
  });
  function hitung(){
    var lama = Number(angkaSaja(nilai("f-gajilama")))||0, baru = Number(angkaSaja(nilai("f-gajibaru")))||0;
    var tmt = nilai("f-tmtbaru"), teks = [];
    if(baru > lama) teks.push("Selisih yang diusulkan " + rupiah(baru-lama) + " per bulan.");
    if(tmt){
      var s = selisihHari(tmt);
      teks.push("Terhitung mulai " + tglIndo(tmt) + " — " + (s >= 0 ? s + " hari lagi." : "sudah terlewat " + Math.abs(s) + " hari."));
    }
    q("#f-hitung").textContent = teks.join(" ");
  }

  function pasangSlot(){
    pasang("[data-pilih]", "click", function(){ q("#file-" + this.dataset.pilih).click(); }, q("#isi"));
    SLOT.forEach(function(s){
      var inp = q("#file-" + s.k);
      if(inp) inp.addEventListener("change", function(){ terimaGambar(s, this.files); });
    });
  }
  pasangSlot();

  function terimaGambar(s, files){
    var file = files && files[0];
    if(!file) return;
    tampilGalat("");
    if(file.type.indexOf("image/") !== 0) return tampilGalat("Lampiran harus berupa gambar (JPG atau PNG).");
    if(file.size > 12*1024*1024) return tampilGalat("Ukuran gambar melebihi 12 MB.");
    kompresGambar(file).then(function(hasil){
      S.berkas[s.k] = { blob: hasil.blob, nama: bersihkan(file.name, 80) };
      q("#slot-" + s.k).innerHTML =
        '<input type="file" id="file-' + s.k + '" accept="image/*" hidden>' +
        '<div class="sj-pratinjau"><img src="' + hasil.url + '" alt="Pratinjau ' + esc(s.judul) + '"><div>' +
        '<div class="sj-pratinjau-nama">' + esc(s.judul) + '</div>' +
        '<div class="sj-row-meta">' + esc(S.berkas[s.k].nama) + '</div>' +
        '<button class="sj-btn sj-btn-teks" data-pilih="' + s.k + '">Ganti gambar</button></div></div>';
      pasangSlot();
    }).catch(function(err){ tampilGalat(err.message); });
  }

  /* usulan gaji terisi sendiri dari tabel PP */
  function isiOtomatis(){
    var gol = nilai("f-golongan"), tmtLama = nilai("f-tmtlama"), tmtBaru = nilai("f-tmtbaru");
    var mkgSekarang = mkgPada(nilai("f-mkt"), nilai("f-mkb"), tmtLama, tmtLama);
    var mkgNanti = mkgPada(nilai("f-mkt"), nilai("f-mkb"), tmtLama, tmtBaru);
    var lama = cariGaji(gol, mkgSekarang), baru = cariGaji(gol, mkgNanti);
    var ket = q("#f-otomatis");
    if(!ket) return;
    if(lama === null && baru === null){
      ket.innerHTML = '<span class="sj-row-meta">Tabel gaji untuk golongan ' + esc(gol) +
        ' belum diisi, jadi kolom gaji diisi manual.</span>';
      return;
    }
    if(lama !== null && !nilai("f-gajilama")) q("#f-gajilama").value = Number(lama).toLocaleString("id-ID");
    if(baru !== null && !nilai("f-gajibaru")) q("#f-gajibaru").value = Number(baru).toLocaleString("id-ID");
    ket.innerHTML = '<span class="sj-info">Menurut PP 5/2024, golongan ' + esc(gol) +
      ' dengan masa kerja ' + mkgNanti + ' tahun bergaji pokok ' + rupiah(baru) +
      '. Angkanya boleh Anda ubah bila berbeda dengan SK.</span>';
    hitung();
  }
  ["f-golongan","f-mkt","f-mkb"].forEach(function(id){
    q("#"+id).addEventListener("change", isiOtomatis);
  });
  q("#f-tmtbaru").addEventListener("change", isiOtomatis);

  q("#f-kirim").addEventListener("click", function(){
    var tombol = this;
    tampilGalat("");
    var f = {
      pangkat: bersihkan(nilai("f-pangkat")), golongan: nilai("f-golongan"),
      jabatan: bersihkan(nilai("f-jabatan")), unit: bersihkan(nilai("f-unit")),
      mkt: angkaSaja(nilai("f-mkt")), mkb: angkaSaja(nilai("f-mkb")),
      nosk: bersihkan(nilai("f-nosk"), 60), tmtLama: nilai("f-tmtlama"), tmtBaru: nilai("f-tmtbaru"),
      gajiLama: Number(angkaSaja(nilai("f-gajilama")))||0,
      gajiBaru: Number(angkaSaja(nilai("f-gajibaru")))||0,
      catatan: bersihkan(nilai("f-catatan"), 400)
    };
    if(!f.pangkat) return tampilGalat("Isi pangkat Anda.");
    if(!f.unit) return tampilGalat("Isi unit kerja Anda.");
    if(!f.tmtLama) return tampilGalat("Isi TMT gaji berkala terakhir.");
    if(!f.tmtBaru) return tampilGalat("Isi TMT gaji berkala berikutnya.");
    if(new Date(f.tmtBaru) <= new Date(f.tmtLama)) return tampilGalat("TMT berikutnya harus setelah TMT terakhir.");
    if(!f.gajiLama) return tampilGalat("Isi gaji pokok saat ini.");
    var kurang = SLOT.filter(function(s){ return s.wajib && !S.berkas[s.k]; });
    if(kurang.length) return tampilGalat("Lampiran belum lengkap: " +
      kurang.map(function(s){ return s.judul; }).join(", ") + ".");

    tombol.disabled = true; tombol.textContent = "Mengirim…";
    var dasar = S.sesi.id + "/" + Date.now() + "-";
    var jalur = {};
    var unggah = SLOT.map(function(s){
      var nama = dasar + s.k + ".jpg";
      jalur[s.k] = nama;
      return sb.storage.from(BUCKET).upload(nama, S.berkas[s.k].blob, { contentType:"image/jpeg", upsert:false });
    });
    var thnIni = new Date().getFullYear();
    Promise.all(unggah)
      .then(function(hasil){
        for(var i=0;i<hasil.length;i++) if(hasil[i].error) throw hasil[i].error;
        return sb.from("pengajuan").insert({
          pegawai_id: S.sesi.id, nip: S.sesi.nip, nama: S.sesi.nama,
          pangkat: f.pangkat, golongan: f.golongan, jabatan: f.jabatan, unit: f.unit,
          masa_kerja: (f.mkt||0) + " tahun " + (f.mkb||0) + " bulan",
          mkg_tahun: Number(f.mkt)||0, mkg_bulan: Number(f.mkb)||0,
          no_sk: f.nosk, tmt_lama: f.tmtLama, tmt_baru: f.tmtBaru,
          gaji_lama: f.gajiLama, gaji_baru: f.gajiBaru,
          catatan: f.catatan, status: "diajukan",
          foto_path: jalur.sk,          nama_foto: S.berkas.sk.nama,
          sk_pangkat_path: jalur.pangkat, nama_sk_pangkat: S.berkas.pangkat.nama,
          skp1_path: jalur.skp1, nama_skp1: S.berkas.skp1.nama, skp1_tahun: thnIni-1,
          skp2_path: jalur.skp2, nama_skp2: S.berkas.skp2.nama, skp2_tahun: thnIni-2
        });
      })
      .then(function(r){
        if(r.error) throw r.error;
        return catat("Kirim pengajuan", "TMT " + f.tmtBaru);
      })
      .then(muatData)
      .then(function(){
        S.tab = "beranda";
        gambarIsi();
        kabar("Pengajuan terkirim dan sudah masuk ke daftar admin.");
      })
      .catch(function(e){
        tombol.disabled = false; tombol.textContent = "Kirim pengajuan";
        tampilGalat(pesanGalat(e));
      });
  });
}

/* ============================================================
   Admin — berkas
   ============================================================ */
function isiBerkas(){
  var d = S.daftar;
  var menunggu = d.filter(function(x){ return x.status === "diajukan"; }).length;
  var disetujui = d.filter(function(x){ return x.status === "disetujui"; }).length;
  var jatuhTempo = d.filter(function(x){
    var s = selisihHari(x.tmtBaru);
    return s !== null && s <= 90 && x.status !== "disetujui";
  }).length;

  var cari = S.cari.trim().toLowerCase();
  var tersaring = d.filter(function(x){
    var st = S.saring === "semua" || x.status === S.saring;
    var ok = !cari || x.nama.toLowerCase().indexOf(cari) >= 0 || x.nip.indexOf(cari) >= 0 ||
      String(x.unit||"").toLowerCase().indexOf(cari) >= 0;
    return st && ok;
  });

  var kunci = ["semua","diajukan","perbaikan","disetujui","ditolak"];
  var html =
  '<div class="sj-statbar">' +
    '<div class="sj-stat"><div class="sj-stat-n">' + menunggu + '</div><div class="sj-stat-l">Menunggu diperiksa</div></div>' +
    '<div class="sj-stat"><div class="sj-stat-n sj-amber">' + jatuhTempo + '</div><div class="sj-stat-l">Jatuh tempo ≤ 90 hari</div></div>' +
    '<div class="sj-stat"><div class="sj-stat-n sj-hijau">' + disetujui + '</div><div class="sj-stat-l">Sudah disetujui</div></div>' +
    '<div class="sj-stat"><div class="sj-stat-n">' + d.length + '</div><div class="sj-stat-l">Total berkas masuk</div></div></div>' +
  '<div class="sj-toolbar"><div class="sj-chips">' +
    kunci.map(function(k){
      return '<button class="sj-chip' + (S.saring === k ? " aktif" : "") + '" data-saring="' + k + '">' +
        (k === "semua" ? "Semua" : STATUS[k].label) + '</button>';
    }).join("") +
  '</div><div class="sj-aksi-kanan">' +

  } else {
    html += '<div class="sj-tabel"><div class="sj-thead sj-row5"><span>Pegawai</span><span>Golongan</span>' +
      '<span>Berlaku mulai</span><span>Gaji usulan</span><span>Status</span></div>' +
      tersaring.map(function(x){
        var s = selisihHari(x.tmtBaru);
        var sisa = s === null ? "" : (s >= 0 ? s + " hari lagi" : "terlewat " + Math.abs(s) + " hari");
        return '<button class="sj-trow sj-row5" data-id="' + x.id + '">' +
          '<span class="sj-td"><strong>' + esc(x.nama) + '</strong><span class="sj-row-meta">' + esc(x.nip) + '</span></span>' +
          '<span class="sj-td">' + esc(x.golongan) + '<span class="sj-row-meta">' + esc(x.unit) + '</span></span>' +
          '<span class="sj-td">' + tglSingkat(x.tmtBaru) + '<span class="sj-row-meta' +
            (s !== null && s <= 90 ? " sj-amber" : "") + '">' + sisa + '</span></span>' +
          '<span class="sj-td sj-td-num">' + rupiah(x.gajiBaru || x.gajiLama) +
            '<span class="sj-row-meta">masuk ' + waktuRelatif(x.dibuat) + '</span></span>' +
          '<span class="sj-td sj-td-status">' + lencana(x.status) + '</span></button>';
      }).join("") + '</div>';
  }

  q("#isi").innerHTML = html;
  pasang(".sj-chip", "click", function(){ S.saring = this.dataset.saring; isiBerkas(); });
  q("#a-segar").addEventListener("click", function(){ muatData().then(gambarIsi); });
  q("#a-cari").addEventListener("input", function(){
    S.cari = this.value;
    var pos = this.selectionStart;
    isiBerkas();
    var baru = q("#a-cari");
    baru.focus(); baru.setSelectionRange(pos, pos);
  });
  q("#a-csv").addEventListener("click", function(){ unduhCsv(tersaring); });
  pasang(".sj-trow", "click", function(){ bukaDetail(this.dataset.id, "admin"); }, q("#isi"));
}

function unduhCsv(baris){
  var kolom = ["Nama","NIP","Pangkat","Golongan","Unit kerja","TMT lama","TMT berikutnya","Gaji lama","Gaji usulan","Status"];
  var isi = [kolom].concat(baris.map(function(d){
    return [d.nama, d.nip, d.pangkat, d.golongan, d.unit, d.tmtLama, d.tmtBaru, d.gajiLama, d.gajiBaru,
      (STATUS[d.status]||{}).label || d.status];
  }));
  var csv = isi.map(function(r){
    return r.map(function(s){ return '"' + String(s == null ? "" : s).replace(/"/g,'""') + '"'; }).join(",");
  }).join("\n");
  var url = URL.createObjectURL(new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8" }));
  var a = document.createElement("a");
  a.href = url;
  a.download = "simoji-kgb-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}

/* Setel ulang sandi orang lain hanya bisa dilakukan di server,
   lewat Edge Function yang memegang kunci rahasia. */
function resetSandi(id, tombol){
  var sasaran = S.akun.filter(function(a){ return a.id === id; })[0];
  if(!sasaran) return;
  if(!confirm("Setel ulang kata sandi " + sasaran.nama + "? Sandi lamanya langsung tidak berlaku.")) return;
  var sandi = sandiAcak();
  tombol.disabled = true;
  tombol.textContent = "Memproses…";
  sb.functions.invoke("reset-sandi", { body: { user_id: id, sandi_baru: sandi } })
    .then(function(r){
      if(r.error) throw r.error;
      if(r.data && r.data.error) throw new Error(r.data.error);
      return sb.from("profil").update({ wajib_ganti: true }).eq("id", id);
    })
    .then(function(){ return catat("Setel ulang sandi", sasaran.nama); })
    .then(function(){
      alert("Kata sandi " + sasaran.nama + " sekarang:\n\n" + sandi +
        "\n\nCatat sekarang, pesan ini tidak bisa dibuka lagi. " +
        "Ia akan diminta menggantinya saat masuk.");
      kabar("Kata sandi " + sasaran.nama + " disetel ulang.");
      return muatData();
    })
    .then(gambarIsi)
    .catch(function(e){
      tombol.disabled = false;
      tombol.textContent = "Setel ulang sandi";
      var t = (e && e.message) || "";
      kabar(/not found|404|Failed to send/i.test(t)
        ? "Edge Function reset-sandi belum dipasang di Supabase."
        : pesanGalat(e));
    });
}

/* Baris profil dibuat oleh trigger di basis data sesaat setelah
   akun terbentuk. Kadang belum terlihat saat langsung dibaca,
   jadi ditunggu beberapa kali sebelum menyerah. */
function tungguProfil(id, sisa){
  sisa = (sisa === undefined) ? 6 : sisa;
  return sb.from("profil").select("id,peran").eq("id", id).maybeSingle().then(function(r){
    if(r.data) return r.data;
    if(sisa <= 0) throw new Error("Profil akun tidak terbentuk. Pastikan supabase.sql sudah dijalankan.");
    return new Promise(function(res){ setTimeout(res, 400); }).then(function(){
      return tungguProfil(id, sisa - 1);
    });
  });
}

function buatAkun(){
  var tombol = q("#k-buat");
  tampilGalat("");
  var nama = bersihkan(nilai("k-nama")), nip = angkaSaja(nilai("k-nip"));
  var sandi = nilai("k-sandi"), peran = nilai("k-peran");
  if(nama.length < 3) return tampilGalat("Tulis nama lengkap pemilik akun.");
  if(nip.length < 8) return tampilGalat("NIP minimal 8 angka.");
  var pesan = periksaSandi(sandi);
  if(pesan) return tampilGalat(pesan);
  if(S.akun.some(function(a){ return a.nip === nip; }))
    return tampilGalat("NIP ini sudah punya akun.");

  tombol.disabled = true; tombol.textContent = "Menyimpan…";
  sbDua.auth.signUp({
    email: suratDariNip(nip), password: sandi,
    options: { data: { nip: nip, nama: nama, peran: "pegawai" } }
  }).then(function(r){
    if(r.error) throw r.error;
    var baru = r.data && r.data.user;
    if(!baru || !baru.id) throw new Error("Server tidak mengembalikan akun baru. Periksa setelan Authentication.");
    /* Supabase menjawab seolah berhasil bila surelnya sudah terdaftar,
       tandanya daftar identities kosong. */
    if(baru.identities && baru.identities.length === 0)
      throw new Error("NIP ini sudah terdaftar sebelumnya, meski belum tampil di daftar akun.");
    return sbDua.auth.signOut().then(function(){ return baru.id; });
  }).then(function(idBaru){
    return tungguProfil(idBaru).then(function(){
      return sb.from("profil")
        .update({ peran: peran, nama: nama, wajib_ganti: true })
        .eq("id", idBaru)
        .select("id,peran,nama")
        .maybeSingle();
    }).then(function(r){
      if(r.error) throw r.error;
      if(!r.data) throw new Error("Akun terbentuk, tapi perannya gagal disimpan. Ubah lewat tombol Jadikan admin.");
      if(r.data.peran !== peran) throw new Error("Peran tidak tersimpan sebagaimana diminta. Periksa aturan RLS pada tabel profil.");
      return r.data;
    });
  }).then(function(){
    return catat("Buat akun", nama + " sebagai " + peran);
  }).then(muatData).then(function(){
    isiAkun();
    alert("Akun " + (peran === "admin" ? "admin" : "pegawai") + " untuk " + nama + " berhasil dibuat.\n\n" +
      "NIP          : " + nip + "\n" +
      "Kata sandi   : " + sandi + "\n\n" +
      "Catat sekarang, pesan ini tidak bisa dibuka lagi. " +
      "Ia akan diminta mengganti kata sandinya saat pertama kali masuk.");
    kabar("Akun " + nama + " dibuat sebagai " + peran + ".");
  }).catch(function(e){
    tombol.disabled = false; tombol.textContent = "Buat akun";
    var t = (e && e.message) || "";
    tampilGalat(/rate limit|too many|For security purposes/i.test(t)
      ? "Supabase membatasi jumlah pendaftaran per jam. Tunggu beberapa menit sebelum membuat akun berikutnya."
      : pesanGalat(e));
    muatData().then(function(){ /* daftar tetap disegarkan agar terlihat apa adanya */ });
  });
}

function ubahPeran(id){
  var sasaran = S.akun.filter(function(a){ return a.id === id; })[0];
  if(!sasaran) return;
  var peran = sasaran.peran === "admin" ? "pegawai" : "admin";
  sb.from("profil").update({ peran: peran }).eq("id", id).then(function(r){
    if(r.error) throw r.error;
    return catat("Ubah peran", sasaran.nama + " menjadi " + peran);
  }).then(muatData).then(function(){
    isiAkun();
    kabar("Peran " + sasaran.nama + " diubah menjadi " + peran + ".");
  }).catch(function(e){ kabar(pesanGalat(e)); });
}

function nonaktifkanAkun(id){
  var sasaran = S.akun.filter(function(a){ return a.id === id; })[0];
  if(!sasaran) return;
  if(!confirm("Nonaktifkan akun " + sasaran.nama + "? Seluruh berkas pengajuannya ikut terhapus dan tidak bisa dikembalikan.")) return;
  sb.from("profil").delete().eq("id", id).then(function(r){
    if(r.error) throw r.error;
    return catat("Nonaktifkan akun", sasaran.nama);
  }).then(muatData).then(function(){
    isiAkun();
    kabar("Akun dinonaktifkan.");
  }).catch(function(e){ kabar(pesanGalat(e)); });
}

/* ============================================================

   ============================================================ */
function bukaDetail(id, peran){
  var d = S.daftar.filter(function(x){ return x.id === id; })[0];
  if(!d) return;
  var selisih = (d.gajiBaru||0) - (d.gajiLama||0);

  var isi =

      '<button class="sj-btn sj-btn-teks" data-tutup="1">Tutup</button></div>' +
    '<div class="sj-laci-status">' + lencana(d.status) +
      (d.status === "disetujui" ? ' <button class="sj-btn sj-btn-halus" id="d-cetak">Cetak nota usulan</button>' : "") +
    '</div>' +
    '<div class="sj-lampiran" id="d-lampiran"><div class="sj-lampiran-kosong">Membuka lampiran…</div></div>' +
    baris("Pangkat / golongan", esc(d.pangkat) + " · " + esc(d.golongan)) +
    baris("Jabatan", esc(d.jabatan) || "—") +
    baris("Unit kerja", esc(d.unit)) +
    baris("Masa kerja golongan", esc(d.masaKerja)) +
    baris("Nomor SK terakhir", esc(d.noSk) || "—") +
    baris("TMT berkala terakhir", tglIndo(d.tmtLama)) +
    baris("TMT berkala berikutnya", tglIndo(d.tmtBaru)) +
    baris("Gaji pokok saat ini", rupiah(d.gajiLama)) +
    baris("Gaji pokok usulan", rupiah(d.gajiBaru) + (selisih > 0 ? ' <span class="sj-hijau">(+' + rupiah(selisih) + ')</span>' : "")) +
    (d.catatan ? baris("Catatan pegawai", esc(d.catatan)) : "") +
    (d.catatanAdmin && peran === "pegawai" ? baris("Catatan kepegawaian", esc(d.catatanAdmin)) : "");

  if(peran === "admin"){
    isi += '<div class="sj-verifikasi"><label class="sj-field"><span>Catatan untuk pegawai</span>' +
      '<textarea id="d-catatan" rows="2" placeholder="Contoh: lampirkan juga SK pangkat terakhir.">' +
      esc(d.catatanAdmin||"") + '</textarea></label>' +
      '<div class="sj-aksi">' +
        '<button class="sj-btn sj-btn-setuju" data-status="disetujui">Setujui</button>' +
        '<button class="sj-btn sj-btn-halus" data-status="perbaikan">Minta perbaikan</button>' +
        '<button class="sj-btn sj-btn-tolak" data-status="ditolak">Tolak</button></div>' +
      '<button class="sj-btn sj-btn-teks sj-hapus" id="d-hapus">Hapus berkas ini</button></div>';
  }

  lapis.innerHTML = '<div class="sj-tirai" id="tirai"><div class="sj-laci" id="laci">' + isi + '</div></div>';
  q("#laci").addEventListener("click", function(e){ e.stopPropagation(); });
  q("#tirai").addEventListener("click", tutupLapis);
  pasang("[data-tutup]", "click", tutupLapis, lapis);
  document.addEventListener("keydown", escTutup);

  var lampiran = [
    { jalur:d.fotoPath,       judul:"SK gaji berkala terakhir" },
    { jalur:d.skPangkatPath,  judul:"SK kenaikan pangkat terakhir" },
    { jalur:d.skp1Path,       judul:"SKP tahun " + (d.skp1Tahun || "—") },
    { jalur:d.skp2Path,       judul:"SKP tahun " + (d.skp2Tahun || "—") }
  ].filter(function(x){ return !!x.jalur; });

  if(!lampiran.length){
    q("#d-lampiran").innerHTML = '<div class="sj-lampiran-kosong">Berkas ini tidak punya lampiran.</div>';
  } else {
    Promise.all(lampiran.map(function(x){
      return sb.storage.from(BUCKET).createSignedUrl(x.jalur, 3600);
    })).then(function(hasil){
      var wadah = q("#d-lampiran");
      if(!wadah) return;
      wadah.innerHTML = lampiran.map(function(x, i){
        var r = hasil[i];
        if(r.error || !r.data) return '<div class="sj-lampiran-kosong">' + esc(x.judul) + ' tidak bisa dibuka.</div>';
        return '<div class="sj-lampiran-satu"><div class="sj-kv-l">' + esc(x.judul) + '</div>' +
          '<button class="sj-lampiran-img" data-besar="' + r.data.signedUrl + '">' +
          '<img src="' + r.data.signedUrl + '" alt="' + esc(x.judul) + '"></button></div>';
      }).join("");
      pasang("[data-besar]", "click", function(){
        var url = this.dataset.besar;
        var z = document.createElement("div");
        z.className = "sj-zoom";
        z.innerHTML = '<img src="' + url + '" alt="Lampiran diperbesar">';
        z.addEventListener("click", function(){ z.remove(); });
        document.body.appendChild(z);
      }, wadah);
    });
  }

  if(q("#d-cetak")) q("#d-cetak").addEventListener("click", function(){ cetakNota(d); });

  if(peran === "admin"){
    pasang("[data-status]", "click", function(){
      ubahStatus(d.id, this.dataset.status, bersihkan(q("#d-catatan").value, 300));
    }, lapis);
    q("#d-hapus").addEventListener("click", function(){ hapusBerkas(d); });
  }
}

function escTutup(e){ if(e.key === "Escape") tutupLapis(); }
function tutupLapis(){
  lapis.innerHTML = "";
  document.removeEventListener("keydown", escTutup);
}

function ubahStatus(id, status, catatanAdmin){
  var sasaran = S.daftar.filter(function(x){ return x.id === id; })[0];
  sb.from("pengajuan").update({ status: status, catatan_admin: catatanAdmin }).eq("id", id)
    .then(function(r){
      if(r.error) throw r.error;
      return catat("Ubah status berkas", (sasaran ? sasaran.nama : "") + " → " + STATUS[status].label);
    })
    .then(muatData)
    .then(function(){
      tutupLapis(); gambarIsi();
      kabar("Berkas ditandai " + STATUS[status].label.toLowerCase() + ".");
    })
    .catch(function(e){ kabar(pesanGalat(e)); });
}

function hapusBerkas(d){
  if(!confirm("Hapus berkas ini beserta lampirannya?")) return;
  sb.from("pengajuan").delete().eq("id", d.id).then(function(r){
    if(r.error) throw r.error;
    if(d.fotoPath) return sb.storage.from(BUCKET).remove([d.fotoPath]);
  }).then(function(){
    return catat("Hapus berkas", d.nama);
  }).then(muatData).then(function(){
    tutupLapis(); gambarIsi();
    kabar("Berkas dihapus.");
  }).catch(function(e){ kabar(pesanGalat(e)); });
}

   Admin — data pegawai
   ============================================================ */
function isiDataPegawai(){
  var terbaru = {};
  S.daftar.forEach(function(d){
    if(!terbaru[d.nip] || d.dibuat > terbaru[d.nip].dibuat) terbaru[d.nip] = d;
  });

  var cari = S.cari.trim().toLowerCase();
  var orang = S.akun.filter(function(a){ return a.peran === "pegawai"; })
    .map(function(a){
      var u = terbaru[a.nip];
      var p = a.profil || {};
      return {
        id:a.id, nip:a.nip, nama:a.nama,
        pangkat: p.pangkat || (u ? u.pangkat : ""),
        golongan: p.golongan || (u ? u.golongan : ""),
        unit: p.unit || (u ? u.unit : ""),
        kgb: u ? u.tmtBaru : "", kgbLama: u ? u.tmtLama : "",
        usulan: u ? u.id : null, status: u ? u.status : null
      };
    })
    .filter(function(o){
      return !cari || o.nama.toLowerCase().indexOf(cari) >= 0 || o.nip.indexOf(cari) >= 0 ||
        String(o.unit).toLowerCase().indexOf(cari) >= 0;
    })
    .sort(function(a,b){ return a.nama.localeCompare(b.nama); });

  var lengkap = orang.filter(function(o){ return o.kgb; }).length;

  var html =
  '<div class="sj-statbar sj-statbar-2">' +
    '<div class="sj-stat"><div class="sj-stat-n">' + orang.length + '</div><div class="sj-stat-l">Pegawai terdaftar</div></div>' +
    '<div class="sj-stat"><div class="sj-stat-n sj-hijau">' + lengkap + '</div><div class="sj-stat-l">Sudah punya data KGB</div></div>' +
  '</div>' +
  '<div class="sj-toolbar"><div class="sj-chips"><span class="sj-row-meta">' +
    'Daftar pegawai beserta data kepegawaian dan kenaikan gaji berkala terakhirnya.</span></div>' +
    '<div class="sj-aksi-kanan">' +
      '<input class="sj-cari" id="dp-cari" value="' + esc(S.cari) + '" placeholder="Cari nama, NIP, atau unit kerja">' +
      '<button class="sj-btn sj-btn-teks" id="dp-segar">Muat ulang</button>' +
      '<button class="sj-btn sj-btn-halus" id="dp-csv"' + (orang.length ? "" : " disabled") + '>Unduh CSV</button>' +
    '</div></div>';

  if(!orang.length){
    html += '<p class="sj-bantuan">Belum ada pegawai yang cocok. Akun pegawai bisa dibuat lewat menu Akun pengguna.</p>';
  } else {
    html += '<div class="sj-tabel"><div class="sj-thead sj-row5"><span>Nama</span><span>NIP</span>' +
      '<span>Pangkat / golongan</span><span>Unit kerja</span><span>KGB terakhir</span></div>' +
      orang.map(function(o){
        var s = o.kgb ? selisihHari(o.kgb) : null;
        return '<button class="sj-trow sj-row5" data-usulan="' + (o.usulan || "") + '" data-nama="' + esc(o.nama) + '">' +
          '<span class="sj-td"><strong>' + esc(o.nama) + '</strong>' +
            (o.status ? '<span class="sj-row-meta">usulan ' + (STATUS[o.status]||{}).label.toLowerCase() + '</span>' : '<span class="sj-row-meta">belum mengirim usulan</span>') + '</span>' +
          '<span class="sj-td sj-td-num">' + esc(o.nip) + '</span>' +
          '<span class="sj-td">' + esc(o.pangkat || "—") +
            '<span class="sj-row-meta">' + esc(o.golongan || "") + '</span></span>' +
          '<span class="sj-td">' + esc(o.unit || "—") + '</span>' +
          '<span class="sj-td">' + (o.kgb ? tglSingkat(o.kgb) : "—") +
            (s !== null ? '<span class="sj-row-meta' + (s <= AMBANG_INGAT ? " sj-amber" : "") + '">' +
              (s >= 0 ? s + " hari lagi" : "terlewat " + Math.abs(s) + " hari") + '</span>' : "") + '</span>' +
          '</button>';
      }).join("") + '</div>';
  }

  q("#isi").innerHTML = html;
  q("#dp-segar").addEventListener("click", function(){ muatData().then(gambarIsi); });
  q("#dp-cari").addEventListener("input", function(){
    S.cari = this.value;
    var pos = this.selectionStart;
    isiDataPegawai();
    var baru = q("#dp-cari");
    baru.focus(); baru.setSelectionRange(pos, pos);
  });
  q("#dp-csv").addEventListener("click", function(){
    var kolom = ["Nama","NIP","Pangkat","Golongan","Unit kerja","KGB terakhir","KGB berikutnya"];
    var isi = [kolom].concat(orang.map(function(o){
      return [o.nama, o.nip, o.pangkat, o.golongan, o.unit, o.kgbLama, o.kgb];
    }));
    var csv = isi.map(function(r){
      return r.map(function(x){ return '"' + String(x == null ? "" : x).replace(/"/g,'""') + '"'; }).join(",");
    }).join("\n");
    var url = URL.createObjectURL(new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = "data-pegawai-" + new Date().toISOString().slice(0,10) + ".csv";
    a.click();
    URL.revokeObjectURL(url);
  });
  pasang(".sj-trow", "click", function(){
    var id = this.dataset.usulan;
    if(id) return bukaDetail(id, "admin");
    kabar(this.dataset.nama + " belum pernah mengirim usulan, jadi berkasnya belum ada.");
  }, q("#isi"));
}

/* ============================================================
   Admin — beranda: ringkasan dan pengingat jatuh tempo
   ============================================================ */
function isiPengingat(){
  var terbaru = {};
  S.daftar.forEach(function(d){
    if(!terbaru[d.nip] || d.dibuat > terbaru[d.nip].dibuat) terbaru[d.nip] = d;
  });
  var daftar = Object.keys(terbaru).map(function(k){ return terbaru[k]; })
    .map(function(d){ d._sisa = selisihHari(d.tmtBaru); return d; })
    .filter(function(d){ return d._sisa !== null && d._sisa <= 180; })
    .sort(function(a,b){ return a._sisa - b._sisa; });

  var lewat = daftar.filter(function(d){ return d._sisa < 0; });
  var dekat = daftar.filter(function(d){ return d._sisa >= 0 && d._sisa <= AMBANG_INGAT; });
  var nanti = daftar.filter(function(d){ return d._sisa > AMBANG_INGAT; });

  function golongan(judul, isi, catatan){
    if(!isi.length) return "";
    return '<div class="sj-panel-head sj-mt"><h2>' + judul + '</h2></div>' +
      '<p class="sj-bantuan">' + catatan + '</p>' +
      '<div class="sj-tabel sj-mt">' + isi.map(function(d){
        var teks = d._sisa < 0 ? "terlewat " + Math.abs(d._sisa) + " hari" : d._sisa + " hari lagi";
        return '<button class="sj-trow sj-row3" data-id="' + d.id + '">' +
          '<span class="sj-td"><strong>' + esc(d.nama) + '</strong>' +
            '<span class="sj-row-meta">' + esc(d.nip) + ' · ' + esc(d.unit) + '</span></span>' +
          '<span class="sj-td">' + tglSingkat(d.tmtBaru) +
            '<span class="sj-row-meta ' + (d._sisa <= AMBANG_INGAT ? "sj-amber" : "") + '">' + teks + '</span></span>' +
          '<span class="sj-td sj-td-status">' + lencana(d.status) + '</span></button>';
      }).join("") + '</div>';
  }

  var html = '<div class="sj-panel-head"><h2>Pengingat jatuh tempo</h2>' +
    '<span class="sj-row-meta">' + S.daftar.length + ' usulan tercatat</span></div>' +
    '<div class="sj-statbar">' +
    '<div class="sj-stat"><div class="sj-stat-n sj-rust">' + lewat.length + '</div><div class="sj-stat-l">Sudah terlewat</div></div>' +
    '<div class="sj-stat"><div class="sj-stat-n sj-amber">' + dekat.length + '</div><div class="sj-stat-l">Jatuh tempo ≤ ' + AMBANG_INGAT + ' hari</div></div>' +
    '<div class="sj-stat"><div class="sj-stat-n">' + nanti.length + '</div><div class="sj-stat-l">Dalam 6 bulan</div></div>' +
    '<div class="sj-stat"><div class="sj-stat-n">' + Object.keys(terbaru).length + '</div><div class="sj-stat-l">Pegawai terpantau</div></div></div>' +
    '<p class="sj-bantuan sj-mt">Daftar disusun dari pengajuan terakhir tiap pegawai. Pegawai yang belum pernah mengirim berkas tidak muncul di sini.</p>';

  if(!daftar.length){
    html += '<p class="sj-bantuan sj-mt">Tidak ada yang jatuh tempo dalam enam bulan ke depan.</p>';
  } else {
    html += golongan("Sudah terlewat", lewat, "Perlu ditindaklanjuti segera, gaji berkalanya sudah lewat tanggal.");
    html += golongan("Segera jatuh tempo", dekat, "Berkas usulan sebaiknya sudah lengkap sekarang.");
    html += golongan("Dalam enam bulan", nanti, "Belum mendesak, cukup diingatkan lewat surat edaran biasa.");
  }

  q("#isi").innerHTML = html;
  pasang(".sj-trow", "click", function(){ bukaDetail(this.dataset.id, "admin"); }, q("#isi"));
}

/* ============================================================
   Admin — tabel gaji pokok
   ============================================================ */
function isiGaji(){
  var perGol = {};
  S.gaji.forEach(function(b){ (perGol[b.golongan] = perGol[b.golongan] || []).push(b); });
  var kosong = GOLONGAN.filter(function(g){ return !perGol[g]; });

  var html = '<div class="sj-panel-head"><h2>Tabel gaji pokok</h2>' +
    '<button class="sj-btn sj-btn-teks" id="g-segar">Muat ulang</button></div>' +
    '<p class="sj-bantuan">Dipakai untuk mengisi kolom gaji usulan secara otomatis. Sumbernya Lampiran PP Nomor 5 Tahun 2024. ' +
    'Bila terbit peraturan gaji baru, perbarui angkanya di sini tanpa perlu mengubah kode.</p>';

  if(kosong.length){
    html += '<div class="sj-galat">Golongan berikut belum ada isinya: ' + kosong.join(", ") +
      '. Selama kosong, pegawai golongan itu mengisi kolom gaji secara manual.</div>';
  }

  html += '<div class="sj-panel sj-mt"><div class="sj-panel-head"><h2>Tambah atau perbarui satu baris</h2></div>' +
    '<div class="sj-grid2">' +
      '<label class="sj-field"><span>Golongan ruang</span><select id="g-gol">' + pilihanGolongan("IV/a") + '</select></label>' +
      '<label class="sj-field"><span>Masa kerja golongan mulai (tahun)</span><input id="g-mkg" inputmode="numeric" placeholder="0"></label>' +
      '<label class="sj-field"><span>Gaji pokok</span><input id="g-nilai" inputmode="numeric" placeholder="3.287.800"></label>' +
    '</div>' +
    '<p class="sj-bantuan">Isi batas bawahnya saja. Contoh: baris "masa kerja 2 sampai 3 tahun" ditulis 2. ' +
    'Baris yang sudah ada akan tertimpa.</p>' +
    '<div id="galat" class="sembunyi"></div>' +
    '<div class="sj-aksi"><button class="sj-btn sj-btn-utama" id="g-simpan">Simpan baris</button></div></div>';

  var isiTabel = GOLONGAN.filter(function(g){ return perGol[g]; }).map(function(g){
    var baris = perGol[g].slice().sort(function(a,b){ return a.mkg_min - b.mkg_min; });
    return '<div class="sj-panel-head sj-mt"><h2>Golongan ' + g + '</h2>' +
      '<span class="sj-row-meta">' + baris.length + ' jenjang</span></div>' +
      '<div class="sj-tabel">' + baris.map(function(b){
        return '<div class="sj-trow sj-row3 sj-statis">' +
          '<span class="sj-td">Masa kerja ' + b.mkg_min + ' tahun ke atas</span>' +
          '<span class="sj-td sj-td-num">' + rupiah(b.gaji) + '</span>' +
          '<span class="sj-td sj-td-status"><button class="sj-btn sj-btn-teks sj-hapus" data-hapus="' +
            g + '|' + b.mkg_min + '">Hapus</button></span></div>';
      }).join("") + '</div>';
  }).join("");

  q("#isi").innerHTML = html + isiTabel;

  q("#g-segar").addEventListener("click", function(){ muatPendukung().then(gambarIsi); });
  q("#g-nilai").addEventListener("input", function(){
    var a = angkaSaja(this.value);
    this.value = a ? Number(a).toLocaleString("id-ID") : "";
  });
  q("#g-simpan").addEventListener("click", function(){
    var tombol = this;
    tampilGalat("");
    var gol = nilai("g-gol"), mkg = angkaSaja(nilai("g-mkg")), gaji = Number(angkaSaja(nilai("g-nilai")));
    if(mkg === "") return tampilGalat("Isi masa kerja mulai.");
    if(!gaji) return tampilGalat("Isi besaran gaji pokok.");
    tombol.disabled = true;
    sb.from("gaji_pokok").upsert({ golongan: gol, mkg_min: Number(mkg), gaji: gaji })
      .then(function(r){
        if(r.error) throw r.error;
        return catat("Perbarui tabel gaji", gol + " masa kerja " + mkg);
      })
      .then(muatPendukung)
      .then(function(){ isiGaji(); kabar("Baris gaji tersimpan."); })
      .catch(function(e){ tombol.disabled = false; tampilGalat(pesanGalat(e)); });
  });
  pasang("[data-hapus]", "click", function(){
    var bagian = this.dataset.hapus.split("|");
    if(!confirm("Hapus baris gaji " + bagian[0] + " masa kerja " + bagian[1] + " tahun?")) return;
    sb.from("gaji_pokok").delete().eq("golongan", bagian[0]).eq("mkg_min", Number(bagian[1]))
      .then(muatPendukung).then(function(){ isiGaji(); kabar("Baris dihapus."); })
      .catch(function(e){ kabar(pesanGalat(e)); });
  }, q("#isi"));
}

/* ============================================================
   Cetak nota usulan KGB
   ============================================================ */
function cetakNota(d){
  var ins = S.instansi || {};
  var kota = ins.kota || "..............";
  var hariIni = tglIndo(new Date().toISOString().slice(0,10));
  var selisih = (d.gajiBaru||0) - (d.gajiLama||0);
  var mkgBaru = mkgPada(d.mkgTahun, d.mkgBulan, d.tmtLama, d.tmtBaru);

  var isi =
  '<div class="kop">' +
    '<div class="kop-nama">' + esc(ins.nama_instansi || "PEMERINTAH DAERAH") + '</div>' +
    '<div class="kop-satker">' + esc(ins.nama_satker || "") + '</div>' +
    '<div class="kop-alamat">' + esc(ins.alamat || "") + '</div>' +
  '</div>' +
  '<h1>Nota Usulan Kenaikan Gaji Berkala</h1>' +

  '<p>Bersama ini diusulkan kenaikan gaji berkala bagi pegawai berikut:</p>' +
  '<table>' +
    '<tr><td class="l">1. Nama</td><td>: ' + esc(d.nama) + '</td></tr>' +
    '<tr><td class="l">2. NIP</td><td>: ' + esc(d.nip) + '</td></tr>' +
    '<tr><td class="l">3. Pangkat / golongan ruang</td><td>: ' + esc(d.pangkat) + ' / ' + esc(d.golongan) + '</td></tr>' +
    '<tr><td class="l">4. Jabatan</td><td>: ' + esc(d.jabatan || "-") + '</td></tr>' +
    '<tr><td class="l">5. Unit kerja</td><td>: ' + esc(d.unit) + '</td></tr>' +
    '<tr><td class="l">6. SK berkala terakhir</td><td>: ' + esc(d.noSk || "-") + ', TMT ' + tglIndo(d.tmtLama) + '</td></tr>' +
    '<tr><td class="l">7. Gaji pokok lama</td><td>: ' + rupiah(d.gajiLama) + '</td></tr>' +
    '<tr><td class="l">8. Gaji pokok baru</td><td>: ' + rupiah(d.gajiBaru) +
      (selisih > 0 ? ' (naik ' + rupiah(selisih) + ')' : "") + '</td></tr>' +
    '<tr><td class="l">9. Masa kerja golongan</td><td>: ' + mkgBaru + ' tahun pada saat TMT baru</td></tr>' +
    '<tr><td class="l">10. Terhitung mulai tanggal</td><td>: ' + tglIndo(d.tmtBaru) + '</td></tr>' +
    '<tr><td class="l">11. Dasar</td><td>: Peraturan Pemerintah Nomor 5 Tahun 2024</td></tr>' +
  '</table>' +
  '<p>Berkas pendukung berupa SK kenaikan gaji berkala terakhir, SK kenaikan pangkat terakhir, ' +
  'serta SKP dua tahun terakhir telah diperiksa dan dinyatakan lengkap.</p>' +
  '<p>Demikian usulan ini disampaikan untuk dapat diproses sebagaimana mestinya.</p>' +
  '<div class="ttd">' +
    '<div>' + esc(kota) + ', ' + hariIni + '</div>' +
    '<div>' + esc(ins.pejabat_jabatan || "Kepala Bagian Kepegawaian") + '</div>' +
    '<div class="ruang"></div>' +
    '<div class="nama">' + esc(ins.pejabat_nama || "……………………………………") + '</div>' +
    '<div>NIP. ' + esc(ins.pejabat_nip || "……………………………") + '</div>' +
  '</div>';

  var gaya = '<style>' +
    '@page{size:A4;margin:2.5cm 2.5cm 2cm 3cm;}' +
    'body{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5;color:#000;}' +
    '.kop{text-align:center;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:22px;}' +
    '.kop-nama{font-size:14pt;font-weight:bold;text-transform:uppercase;}' +
    '.kop-satker{font-size:13pt;font-weight:bold;text-transform:uppercase;}' +
    '.kop-alamat{font-size:10pt;}' +
    'h1{font-size:13pt;text-align:center;text-decoration:underline;margin:0 0 4px;}' +
    '.nomor{text-align:center;margin:0 0 22px;}' +
    'table{width:100%;border-collapse:collapse;margin:14px 0 18px;}' +
    'td{vertical-align:top;padding:2px 0;}' +
    'td.l{width:42%;}' +
    '.ttd{margin-top:34px;width:45%;margin-left:55%;}' +
    '.ruang{height:70px;}' +
    '.nama{font-weight:bold;text-decoration:underline;}' +
    '@media screen{body{max-width:21cm;margin:20px auto;padding:2cm;background:#fff;}}' +

  var jendela = window.open("", "_blank");
  if(!jendela) return kabar("Jendela cetak diblokir peramban. Izinkan pop-up untuk situs ini.");

/* ============================================================
   Ubah kata sandi
   ============================================================ */
function bukaUbahSandi(wajib){
  lapis.innerHTML =
  '<div class="sj-tirai" id="tirai"><div class="sj-laci sj-laci-kecil" id="laci">' +
    '<div class="sj-laci-head"><div><h2>Ubah kata sandi</h2>' +
      '<p class="sj-row-meta">' + esc(S.sesi.nama) + ' · ' + esc(S.sesi.nip) + '</p></div>' +
      (wajib ? "" : '<button class="sj-btn sj-btn-teks" data-tutup="1">Tutup</button>') + '</div>' +
    (wajib ? '<p class="sj-info sj-mt">Akun ini dibuatkan oleh admin. Ganti kata sandinya dulu sebelum melanjutkan.</p>' : "") +
    '<div class="sj-mt">' +
      '<label class="sj-field"><span>Kata sandi baru</span><input id="s-baru" type="password">' +
        '<span class="sj-kekuatan" id="s-kekuatan">' + barKekuatan("") + '</span></label>' +
      '<label class="sj-field"><span>Ulangi kata sandi baru</span><input id="s-ulangi" type="password"></label>' +
    '</div>' +
    '<div id="galat" class="sembunyi"></div>' +
    '<div class="sj-aksi"><button class="sj-btn sj-btn-utama" id="s-simpan">Simpan kata sandi</button>' +
      (wajib ? "" : '<button class="sj-btn sj-btn-halus" data-tutup="1">Batal</button>') + '</div>' +
  '</div></div>';

  q("#laci").addEventListener("click", function(e){ e.stopPropagation(); });
  if(!wajib){
    q("#tirai").addEventListener("click", tutupLapis);
    pasang("[data-tutup]", "click", tutupLapis, lapis);
    document.addEventListener("keydown", escTutup);
  }
  q("#s-baru").addEventListener("input", function(){ q("#s-kekuatan").innerHTML = barKekuatan(this.value); });

  q("#s-simpan").addEventListener("click", function(){
    var tombol = this;
    tampilGalat("");
    var baru = nilai("s-baru"), ulangi = nilai("s-ulangi");
    var pesan = periksaSandi(baru);
    if(pesan) return tampilGalat(pesan);
    if(baru !== ulangi) return tampilGalat("Ulangan kata sandi belum sama.");

    tombol.disabled = true;
    sb.auth.updateUser({ password: baru }).then(function(r){
      if(r.error) throw r.error;
      return sb.from("profil").update({ wajib_ganti: false }).eq("id", S.sesi.id);
    }).then(function(){
      S.sesi.wajibGanti = false;
      return catat("Ganti kata sandi", "");
    }).then(function(){
      tutupLapis();
      kabar("Kata sandi diganti.");
    }).catch(function(e){
      tombol.disabled = false;
      tampilGalat(pesanGalat(e));
    });
  });
}

/* ============================================================
   Mulai
   ============================================================ */
sb.auth.getSession().then(function(r){
  if(r.data && r.data.session) return muatProfil();
  return null;
}).then(function(profil){
  if(profil){
    S.sesi = profil;
    return mulaiPanel();
  }
  return periksaAdmin().then(gambarMasuk);
}).catch(function(e){
  app.innerHTML = '<div class="sj-muat">Gagal menghubungi Supabase.<br><br>' + esc(pesanGalat(e)) + '</div>';
});

/* Penyegaran berkala hanya untuk tab yang isinya sekadar daftar.
   Tab dengan formulir dilewati, dan penyegaran ditunda selama
   ada kolom isian yang sedang disentuh, supaya ketikan tidak hilang. */
var TAB_AMAN = { beranda:1, usulan:1, pegawai:1, log:1 };

function bolehSegarOtomatis(){
  if(!S.sesi || S.sesi.peran !== "admin") return false;
  if(lapis.innerHTML) return false;
  if(!TAB_AMAN[S.tab]) return false;
  var f = document.activeElement;
  if(f && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)) return false;
  return true;
}

setInterval(function(){
  if(bolehSegarOtomatis()) muatData().then(gambarIsi);
}, 20000);
</script>
